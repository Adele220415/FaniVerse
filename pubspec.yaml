name: faniverse_main
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8

  # Networking (TVmaze show data - no API key required)
  http: ^1.6.0
  dio: ^5.9.0

  # Remote image loading with disk caching
  cached_network_image: ^3.4.1

  # File selection from the device (gallery / file browser)
  image_picker: ^1.2.2
  file_picker: ^8.1.7

  # Video playback with play/pause, seek and volume controls
  video_player: ^2.9.2

  # Category illustrations (SVG), replacing the emoji glyphs
  flutter_svg: ^2.3.0

  # Push notifications (Firebase Cloud Messaging).
  # 15.x is incompatible with firebase_ai 4.x - they pin different major
  # versions of firebase_core_platform_interface - so this has to be 16.x.
  firebase_messaging: ^16.7.0

  # Offline content cache.
  # sqflite has no web implementation, so sqflite_common_ffi_web is what makes
  # this work in the Chrome build. See README for the wasm/worker setup.
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Online/offline signal for the offline banner and upload gating
  connectivity_plus: ^6.1.0

  # Local flags (onboarding seen)
  shared_preferences: ^2.5.5
  image: ^4.10.1

  # Maps.
  #
  # google_maps_flutter covers Android/iOS/Web only - it has no Linux, Windows or
  # macOS implementation, so the UI has to degrade on those targets rather than
  # assume the widget exists. See lib/core/constants/maps_config.dart.
  google_maps_flutter: ^2.13.1

  # Venue string -> coordinates, using the device's own geocoder. Chosen over
  # the Google Geocoding API so resolving an address costs nothing and needs no
  # billing. Not available on Web or desktop, so callers must handle a null.
  geocoding: ^4.0.0

  # Opens the resolved location in Google Maps on platforms with no map SDK.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # Regenerates every platform launcher icon from assets/branding/app_icon.png.
  # Run `dart run flutter_launcher_icons` after changing the artwork.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # One illustration per fandom category, generated by
    # tool/generate_category_art.py. Registered per-file so a new category
    # cannot silently fail to load.
    - assets/categories/
    # Onboarding card illustrations, from tool/generate_onboarding_art.py
    - assets/onboarding/
    # assets/branding/ is deliberately NOT listed here. Those PNGs are build-time
    # inputs for flutter_launcher_icons - the launcher reads them off disk, not
    # out of the app bundle - so registering them would ship ~240KB of icons no
    # widget ever displays. Add the entry if a screen starts rendering the mark.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icon generation. Run `dart run flutter_launcher_icons` after editing
# assets/branding/app_icon.png (regenerate that with
# `python tool/generate_app_icon.py`).
#
# `remove_alpha_ios: true` matters here - iOS rejects any alpha channel in an
# app icon, and the generator's output is RGBA.
flutter_launcher_icons:
  # `true` keeps the resource name `ic_launcher`, which is what
  # AndroidManifest.xml already points at. Setting a custom name here would
  # generate a new mipmap and leave the manifest referencing the old one.
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#1A0B3D"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#1A0B3D"
    theme_color: "#1A0B3D"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_name: "fani_verse_icon"
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
